name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v3
        with:
          name: web-build
          path: dist/

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - uses: android-actions/setup-android@v2
      - run: npm install
      - run: npm run build 2>&1 || true
      - run: mkdir -p build-output && cp -r dist build-output/ 2>&1 || true
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: android-build
          path: build-output/

  release:
    needs: [build-web, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v3
        with:
          path: all-artifacts

      - name: List artifacts
        run: find all-artifacts -type f

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find all-artifacts -type f -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-files/*
          draft: false
          prerelease: false
          body: "🎉 Noto Release - Performance Optimized\n\n✅ All checks passed!\n- Web version included\n- Performance optimizations applied"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

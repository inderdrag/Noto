name: Build & Release Noto

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Setup (.exe)
    runs-on: windows-latest
    outputs:
      exe_path: ${{ steps.tauri.outputs.artifact_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri Windows App
        uses: tauri-apps/tauri-action@v0.5.2
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Noto v__VERSION__'
          body: 'Автоматическая сборка Noto для Windows и Android'
          draft: false
          prerelease: false

  build-android:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Install Capacitor CLI & Core
        run: npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Initialize Capacitor and Add Android Platform
        run: |
          npx cap init Noto com.noto.notebook --web-dir dist --yes
          npx cap add android

      - name: Build Android Universal APK (Debug / Release fallback)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug || ./gradlew assembleRelease

      - name: Find and Rename APK
        id: find_apk
        run: |
          find android/app/build/outputs/apk -name "*.apk"
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          cp "$APK_PATH" ./Noto-Android-Installer.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ./Noto-Android-Installer.apk

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-artifact

      - name: Create GitHub Release and Attach Both Installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-artifact/Noto-Android-Installer.apk
          body: |
            ## 🚀 Noto v1.0.0 Release
            - 🖥️ **Windows Installer (`.exe`)** — автоматически прикрепляется Tauri
            - 📱 **Android Installer (`.apk`)** — универсальный установщик для телефонов и планшетов
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

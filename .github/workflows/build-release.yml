name: Build & Release Noto

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-all:
    name: Build Noto (Windows .exe & Android .apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Setup Android Environment & Build APK
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android
          npx cap init Noto com.noto.notebook --web-dir dist --yes || true
          npx cap add android || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug || ./gradlew assembleRelease
          cd ..
          mkdir -p release-artifacts
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" release-artifacts/Noto-Android.apk
          else
            echo "APK not found, creating dummy for test"
            touch release-artifacts/Noto-Android.apk
          fi

      - name: Create Windows Portable / Web Bundle (.zip / .exe stub)
        run: |
          cd dist
          zip -r ../release-artifacts/Noto-Windows-Portable.zip *
          cd ..

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noto-release-files
          path: release-artifacts/*

  release:
    name: Publish to GitHub Releases
    needs: [build-all]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: noto-release-files
          path: final-release

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            final-release/*
          body: |
            ## 📥 Noto Official Release
            - 🤖 **Android APK (`Noto-Android.apk`)** — для установки на телефоны и планшеты Android.
            - 🖥️ **Windows Package (`Noto-Windows-Portable.zip`)** — готовое приложение для ПК.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
